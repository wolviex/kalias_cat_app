<!DOCTYPE html>
<html>
<head>
  <!--
    Flutter's dev server derives its request base path from a literal <base>
    element in this source file. The manifold proxy strips /proxy/8080/ before
    forwarding requests, so the dev source cannot contain a literal proxy base.
    Instead, derive and inject it from the browser URL at runtime.
  -->
  <script>
    (function () {
      const proxyBasePath = window.location.pathname.match(/^\/proxy\/\d+(?:\/|$)/);
      const basePath = proxyBasePath
          ? (proxyBasePath[0].endsWith('/') ? proxyBasePath[0] : `${proxyBasePath[0]}/`)
          : '$FLUTTER_BASE_HREF';

      const base = document.createElement('base');
      base.href = basePath;
      document.head.appendChild(base);
    }());
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kalias">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kalias</title>
  <link rel="manifest" href="manifest.json">
</head>

</html>
