<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kalia — Calm & Clever — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&family=Fraunces:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  /* ── Watercolor storybook system ─────────────────────────────── */
  :root {
    /* Warm paper palette */
    --paper:      #F5ECDE;
    --paper-2:    #EEE1CB;
    --ink:        #3D2E23;
    --ink-soft:   #6B5A4A;
    --ink-faint:  #A39282;

    /* Accents — same chroma family */
    --blush:   #E8B4A0;   /* Kalia / warmth */
    --sage:    #A8C5A0;   /* Loaf / calm   */
    --butter:  #F0D090;   /* Noodles / joy */
    --lilac:   #B8A5D0;   /* Robot / logic */
    --dusk:    #D88A7A;   /* deeper coral   */
    --stream:  #8FB8C7;   /* water/air      */

    /* Time-of-day overlay (default: afternoon) */
    --time-overlay: rgba(255, 220, 170, 0.00);
    --time-floor: rgba(80, 55, 30, 0.00);

    --radius-s: 10px;
    --radius-m: 18px;
    --radius-l: 28px;

    --shadow-sm: 0 2px 6px rgba(61,46,35,0.08);
    --shadow-md: 0 10px 28px rgba(61,46,35,0.14);
    --shadow-lg: 0 24px 60px rgba(61,46,35,0.22);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--ink);
    background: #E8DFD0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(1200px 700px at 20% -10%, #F6ECD9 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, #E3CFB2 0%, transparent 55%),
      #DDCDB3;
  }

  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    gap: 40px;
  }

  /* hand-lettered */
  .script { font-family: 'Caveat', cursive; font-weight: 700; letter-spacing: 0.2px; }

  /* ── Side panel (project reasoning + tweaks) ─────────────────── */
  .side {
    width: 300px;
    max-height: 92vh;
    overflow-y: auto;
    background: #FBF5EA;
    border-radius: var(--radius-l);
    padding: 24px;
    box-shadow: var(--shadow-md);
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink-soft);
  }
  .side h1 { font-family: 'Caveat'; font-size: 38px; color: var(--ink); margin: 0 0 6px; }
  .side h2 { font-family: 'Nunito'; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-soft); margin: 18px 0 8px; }
  .side p { margin: 0 0 10px; }
  .side .tag { display: inline-block; background: var(--paper-2); color: var(--ink); padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 700; margin-right: 4px; margin-bottom: 4px; }

  /* Tweak controls */
  .tweak-group { margin-bottom: 14px; }
  .tweak-label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); margin-bottom: 6px; }
  .seg { display: flex; gap: 4px; background: var(--paper-2); padding: 4px; border-radius: 12px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--ink-soft); font-family: inherit; font-weight: 700; font-size: 12px; padding: 6px 4px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow-sm); }
  .seg-emoji button { font-size: 16px; padding: 6px 2px; }

  .swatches { display: flex; gap: 6px; }
  .swatches button {
    width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent;
    cursor: pointer; transition: all 0.15s;
  }
  .swatches button.on { border-color: var(--ink); transform: scale(1.06); }

  /* Paper/watercolor textures via SVG filters */
  .paper-tex {
    position: absolute; inset: 0; pointer-events: none;
    opacity: 0.5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.3   0 0 0 0 0.22   0 0 0 0 0.15   0 0 0 0.08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ── Toast for feedback ──────────────────────────────────────── */
  .toast {
    position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: #fff; color: var(--ink); padding: 10px 16px;
    border-radius: 100px; font-family: 'Caveat'; font-size: 22px; font-weight: 700;
    box-shadow: var(--shadow-md);
    opacity: 0; pointer-events: none;
    transition: all 0.35s cubic-bezier(.2,.8,.2,1);
    z-index: 40;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 0) scale(0.8); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -120px) scale(1.1); }
  }
  @keyframes sway {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-2px) rotate(0.8deg); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.015); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-1.5px); }
  }
  @keyframes twitch-tail {
    0%, 90%, 100% { transform: rotate(0deg); }
    92% { transform: rotate(4deg); }
    95% { transform: rotate(-3deg); }
  }
  @keyframes driftDust {
    0% { transform: translate(0,0); opacity: 0; }
    20% { opacity: 0.55; }
    100% { transform: translate(var(--dx,40px), var(--dy,-80px)); opacity: 0; }
  }
  @keyframes popin {
    0% { transform: scale(0.4); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  @media (max-width: 900px) {
    .side { display: none; }
    .page { padding: 20px 0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="characters.jsx"></script>
<script type="text/babel" src="room.jsx"></script>
<script type="text/babel" src="care_sheet.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

</body>
</html>
